<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ file_name }} - TG Index Player</title>

    <!-- Plyr CSS CDN -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        :root {
            --plyr-color-main: #0088cc; /* Telegram Accent Color */
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 960px;
        }
        .player-wrapper {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            background: #000;
        }
        .meta-card {
            background: #1e293b;
            margin-top: 16px;
            padding: 20px;
            border-radius: 12px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .btn-primary { background: #0088cc; color: #fff; }
        .btn-primary:hover { background: #006699; }
        .btn-vlc { background: #ff8800; color: #fff; }
        .btn-vlc:hover { background: #cc6600; }
        .btn-mx { background: #00a8ff; color: #fff; }
        .btn-mx:hover { background: #0077b6; }
    </style>
</head>
<body>

<div class="container">
    <!-- Modern HTML5 Video Player -->
    <div class="player-wrapper">
        <video id="player" playsinline controls preload="metadata" poster="{{ thumbnail_url or '' }}">
            <source src="{{ stream_url }}" type="{{ mime_type or 'video/mp4' }}" />
            Your browser does not support HTML5 video streaming.
        </video>
    </div>

    <!-- Metadata & External Player Actions -->
    <div class="meta-card">
        <h2>{{ file_name }}</h2>
        <p>File Size: <strong>{{ file_size }}</strong></p>

        <div class="btn-group">
            <!-- Direct Download -->
            <a href="{{ stream_url }}?download=true" class="btn btn-primary" download>
                📥 Download File
            </a>
            
            <!-- External Player Deep Links -->
            <a href="vlc://{{ stream_url }}" class="btn btn-vlc">
                🍊 Open in VLC
            </a>
            <a href="intent:{{ stream_url }}#Intent;package=com.mxtech.videoplayer.ad;type=video/*;end" class="btn btn-mx">
                ▶️ Open in MX Player
            </a>
        </div>
    </div>
</div>

<!-- Plyr JS CDN -->
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const player = new Plyr('#player', {
            controls: [
                'play-large', 'restart', 'rewind', 'play', 'fast-forward',
                'progress', 'current-time', 'duration', 'mute', 'volume',
                'captions', 'settings', 'pip', 'airplay', 'fullscreen'
            ],
            seekTime: 10,
            keyboard: { focused: true, global: true },
            tooltips: { controls: true, seek: true }
        });
    });
</script>

</body>
</html>
